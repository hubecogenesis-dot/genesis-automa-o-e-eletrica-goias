        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Inter',system-ui,sans-serif}
        :root{
          --bg-principal:#0d1117;
          --bg-card:#161b22;
          --bg-card-hover:#1c2330;
          --texto-claro:#f0f6fc;
          --texto-cinza:#8b949e;
          --verde-marca:#2ea44f;
          --amarelo-marca:#f39c12;
          --vermelho-marca:#ea4335;
          --wpp-cor:#25d366;
          --borda:#21262d;
        }
        body{background:var(--bg-principal)}
        .genesis-root{background:var(--bg-principal);color:var(--texto-claro);line-height:1.6;overflow-x:hidden}

        /* HEADER */
        .site-header{
          background:rgba(22,27,34,0.95);
          backdrop-filter: blur(10px);
          text-align:center;
          padding:42px 20px 30px;
          border-bottom:4px solid var(--verde-marca);
          position:sticky;top:0;z-index:50;
          transition: all .25s ease;
        }
        .site-header.scrolled{padding:20px 20px 16px; box-shadow:0 8px 30px rgba(0,0,0,0.4)}
        .logo-text{font-size:3rem;font-weight:900;letter-spacing:6px;line-height:1}
        .logo-text span{color:var(--amarelo-marca)}
        .header-line{height:3px;width:148px;margin:12px auto;background:linear-gradient(90deg,var(--verde-marca) 0%,var(--amarelo-marca) 50%,var(--vermelho-marca) 100%);border-radius:2px}
        .subtitle{color:var(--texto-cinza);font-size:.9rem;text-transform:uppercase;letter-spacing:2.4px;font-weight:600;margin-top:2px}
        .location-badge{color:var(--texto-claro);font-weight:900;font-size:1.35rem;margin-top:8px;letter-spacing:4px}
        .badge-avaliacao{
          display:inline-flex;align-items:center;gap:8px;
          background:rgba(243,156,18,0.08);color:var(--amarelo-marca);
          padding:8px 18px;border-radius:999px;margin-top:16px;
          font-weight:700;font-size:.85rem;border:1px solid rgba(243,156,18,0.3);
        }
        .badge-avaliacao i{font-size:.95rem}
        .header-email{
          margin-top:12px;
          display:inline-flex;align-items:center;gap:8px;
          font-size:.85rem;color:var(--texto-cinza);
        }
        .header-email a{
          color:var(--texto-claro);text-decoration:none;font-weight:600;
          transition:color .2s;
        }
        .header-email a:hover{color:var(--verde-marca)}
        .header-email i{color:var(--texto-cinza);font-size:.85rem}

        /* HERO */
        .hero{
          text-align:center;
          padding:70px 20px 60px;
          background: radial-gradient(600px 400px at 50% 0%, rgba(46,164,79,0.18) 0%, transparent 60%), linear-gradient(180deg,var(--bg-card) 0%,var(--bg-principal) 100%);
          position:relative;
        }
        .hero-inner{max-width:760px;margin:0 auto}
        .hero h2{font-size:2.6rem;font-weight:900;letter-spacing:-0.02em;line-height:1.05;margin-bottom:18px;text-transform:uppercase}
        .hero h2 span{color:var(--verde-marca);position:relative}
        .hero p{color:var(--texto-cinza);max-width:620px;margin:0 auto 34px;font-size:1.12rem;line-height:1.6}
        .hero p strong{color:var(--texto-claro);font-weight:700}
        .hero-bullets{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:30px}
        .hero-bullets span{font-size:.82rem;color:var(--texto-cinza);display:flex;align-items:center;gap:6px;background:#0f141c;border:1px solid var(--borda);padding:6px 12px;border-radius:999px}
        .hero-bullets i{color:var(--verde-marca)}

        .btn-whatsapp{
          display:inline-flex;align-items:center;justify-content:center;gap:12px;
          background:var(--wpp-cor);color:#fff;text-decoration:none;
          padding:16px 32px;border-radius:999px;font-size:1.12rem;font-weight:800;
          transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
          box-shadow:0 10px 24px rgba(37,211,102,0.28), 0 0 0 1px rgba(255,255,255,0.08) inset;
          border:none;cursor:pointer;letter-spacing:.2px;
          width:auto;
        }
        .btn-whatsapp i{font-size:1.45rem}
        .btn-whatsapp:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 14px 30px rgba(37,211,102,0.4);filter:brightness(1.05)}
        .btn-whatsapp:active{transform:translateY(0) scale(.99)}
        .btn-whatsapp.large{padding:18px 36px;font-size:1.25rem}

        .container{max-width:1160px;margin:0 auto;padding:20px}
        .section{padding:56px 20px}
        .section-title{text-align:center;font-size:1.7rem;font-weight:900;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
        .section-subtitle{text-align:center;color:var(--texto-cinza);margin-bottom:36px;font-size:1rem}
        .eyebrow{text-align:center;color:var(--amarelo-marca);font-weight:800;letter-spacing:2.5px;font-size:.78rem;text-transform:uppercase;margin-bottom:10px}

        /* SERVICES */
        .services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:20px}
        .service-card{
          background:var(--bg-card);border-radius:16px;padding:26px 22px 20px;
          border:1px solid var(--borda);text-align:left;position:relative;
          transition:transform .22s ease, border-color .22s ease, background .22s ease, box-shadow .22s ease;
          cursor:pointer;overflow:hidden;display:flex;flex-direction:column;min-height:214px;
        }
        .service-card:before{
          content:'';position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--verde-marca),var(--amarelo-marca));opacity:0;transition:opacity .22s ease;
        }
        .service-card:hover{transform:translateY(-4px);border-color:rgba(46,164,79,0.55);background:var(--bg-card-hover);box-shadow:0 18px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(46,164,79,0.15) inset}
        .service-card:hover:before{opacity:1}
        .service-icon{
          width:48px;height:48px;border-radius:12px;background:rgba(46,164,79,0.12);border:1px solid rgba(46,164,79,0.22);
          display:flex;align-items:center;justify-content:center;font-size:1.35rem;color:var(--verde-marca);margin-bottom:16px;
        }
        .service-card h3{font-size:1.12rem;font-weight:800;margin-bottom:8px;letter-spacing:-0.01em}
        .service-card p{color:var(--texto-cinza);font-size:.94rem;line-height:1.55;flex:1}
        .service-cta{
          margin-top:18px;display:inline-flex;align-items:center;gap:8px;
          color:var(--verde-marca);font-weight:800;font-size:.88rem;letter-spacing:.2px;
        }
        .service-cta i{transition:transform .18s ease}
        .service-card:hover .service-cta i{transform:translateX(4px)}

        /* Diferenciais */
        .diferenciais{
          background:var(--bg-card);border:1px solid var(--borda);border-radius:18px;
          padding:36px 22px;margin:18px auto;max-width:1160px;
        }
        .diferenciais-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px}
        .diferencial-item{text-align:center;padding:14px 10px;border-radius:12px;background:rgba(255,255,255,0.015);border:1px solid transparent;transition:background .2s}
        .diferencial-item:hover{background:rgba(255,255,255,0.03);border-color:rgba(255,255,255,0.06)}
        .diferencial-item i{font-size:1.9rem;color:var(--amarelo-marca);margin-bottom:12px;display:block}
        .diferencial-item p{font-size:1rem;font-weight:800;margin-bottom:2px}
        .diferencial-item span{color:var(--texto-cinza);font-size:.86rem;display:block}

        /* Como funciona */
        .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:980px;margin:0 auto}
        .step{
          background:var(--bg-card);border:1px solid var(--borda);border-radius:16px;padding:28px 22px;text-align:center;position:relative;
        }
        .step-num{
          width:44px;height:44px;border-radius:999px;background:linear-gradient(135deg,var(--verde-marca),#1f7a37);
          display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#fff;margin-bottom:14px;font-size:1.1rem;
          box-shadow:0 8px 18px rgba(46,164,79,0.35);
        }
        .step h4{font-size:1.05rem;font-weight:800;margin-bottom:6px}
        .step p{color:var(--texto-cinza);font-size:.92rem}
        .step-arrow{display:flex;align-items:center;justify-content:center;color:var(--borda);font-size:1.2rem}
        @media (max-width:860px){
          .steps{grid-template-columns:1fr; max-width:420px}
          .step-arrow{transform:rotate(90deg);padding:4px 0}
        }

        /* CTA Final */
        .cta-final{
          background: radial-gradient(500px 300px at 50% 0%, rgba(37,211,102,0.18), transparent 70%), linear-gradient(180deg, #131a24 0%, #0d1117 100%);
          border:1px solid var(--borda);border-radius:20px;padding:54px 22px;text-align:center;max-width:1160px;margin:22px auto 0;
          position:relative;overflow:hidden;
        }
        .cta-final:before{
          content:'';position:absolute;top:-1px;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--verde-marca),transparent);opacity:.8
        }
        .cta-final h2{font-size:2rem;font-weight:900;line-height:1.1;margin-bottom:10px}
        .cta-final p{color:var(--texto-cinza);max-width:560px;margin:0 auto 26px;font-size:1.05rem}
        .cta-email{
          margin-top:18px;
          color:var(--texto-cinza);
          font-size:.92rem;
        }
        .cta-email a{
          color:var(--texto-claro);
          font-weight:700;
          text-decoration:none;
          border-bottom:1px dashed rgba(240,246,252,0.35);
          transition:color .2s, border-color .2s;
        }
        .cta-email a:hover{
          color:var(--verde-marca);
          border-color:var(--verde-marca);
        }

        /* Footer */
        footer{
          background:var(--bg-card);text-align:center;padding:38px 20px 30px;margin-top:46px;
          border-top:1px solid var(--borda);color:var(--texto-cinza);font-size:.92rem;
        }
        .footer-brand{color:var(--texto-claro);font-weight:900;font-size:1.15rem;letter-spacing:2px;margin-bottom:6px}
        .footer-brand span{color:var(--amarelo-marca)}
        .social-links{margin:16px 0 18px;display:flex;justify-content:center;gap:12px}
        .social-links a{width:40px;height:40px;border-radius:999px;background:#0f141c;border:1px solid var(--borda);display:inline-flex;align-items:center;justify-content:center;color:var(--texto-claro);font-size:1.15rem;text-decoration:none;transition:all .2s}
        .social-links a:hover{border-color:var(--verde-marca);color:var(--verde-marca);transform:translateY(-2px)}
        .footer-contacts{
          margin:18px auto 0;
          max-width:560px;
          display:flex;flex-wrap:wrap;justify-content:center;gap:14px 22px;
          font-size:.9rem;color:var(--texto-cinza);
        }
        .footer-contacts span{display:inline-flex;align-items:center;gap:7px}
        .footer-contacts i{color:var(--texto-cinza);font-size:.9rem}
        .footer-contacts a{color:var(--texto-claro);text-decoration:none;font-weight:600;transition:color .2s}
        .footer-contacts a:hover{color:var(--verde-marca)}

        /* Floating */
        .wpp-floating{
          position:fixed;bottom:22px;right:22px;width:58px;height:58px;border-radius:50%;
          background:var(--wpp-cor);color:#fff;display:flex;align-items:center;justify-content:center;
          font-size:30px;box-shadow:0 10px 28px rgba(37,211,102,0.45), 0 0 0 1px rgba(255,255,255,0.15) inset;
          z-index:100;transition:transform .2s ease;cursor:pointer;border:none;
        }
        .wpp-floating:hover{transform:scale(1.08)}
        .wpp-floating:after{
          content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--wpp-cor);
          animation:pulse 1.9s infinite;
        }
        @keyframes pulse{
          0%{transform:scale(1);opacity:.8}
          100%{transform:scale(1.55);opacity:0}
        }

        /* Anim */
        .reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease, transform .6s ease}
        .reveal.in-view{opacity:1;transform:translateY(0)}

        /* Responsive */
        @media (max-width:640px){
          .logo-text{font-size:2.15rem;letter-spacing:4px}
          .hero h2{font-size:1.72rem;line-height:1.15}
          .hero{padding:42px 18px 40px}
          .section{padding:40px 16px}
          .section-title{font-size:1.35rem}
          .btn-whatsapp{width:100%;justify-content:center;border-radius:14px;padding:16px 18px}
          .container{padding:16px}
          .diferenciais{padding:26px 16px}
          .cta-final{padding:36px 18px;border-radius:16px}
          .cta-final h2{font-size:1.55rem}
          .wpp-floating{bottom:16px;right:16px;width:56px;height:56px;font-size:28px}
        }
